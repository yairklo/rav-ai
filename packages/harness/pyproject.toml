[project]
name = "rav-harness"
version = "0.1.0"
description = "Thin agent loop (LiteLLM + deterministic corpus tools) that answers halakhic questions with a typed, verifiable Answer."
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "rav-ai",
    "rav-evals",
    "textnorm",
]

[project.scripts]
rav-harness = "rav_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
rav-ai = { workspace = true }
rav-evals = { workspace = true }
textnorm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rav_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
