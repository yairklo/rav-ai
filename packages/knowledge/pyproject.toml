[project]
name = "rav-knowledge"
version = "0.1.0"
description = "Knowledge layer over the corpus: sugyot, moves, issues, positions, machlokot, source claims. Text is the authority; every claim is anchored to a raw-text span."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "tiktoken>=0.8",
    "rav-ai",
    "textnorm",
    "rav-evals",
    "rav-harness",
]

[project.scripts]
rav-kl = "rav_knowledge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
rav-ai = { workspace = true }
rav-evals = { workspace = true }
rav-harness = { workspace = true }
textnorm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rav_knowledge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
markers = ["db: needs Postgres (docker compose up -d); REQUIRE_DB=1 turns a skip into a failure"]
