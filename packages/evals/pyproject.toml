[project]
name = "rav-evals"
version = "0.1.0"
description = "Answer schema, deterministic citation verifier and eval runner for rav-ai."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "textnorm",
    "rav-ai",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.uv.sources]
textnorm = { workspace = true }
rav-ai = { workspace = true }

[project.scripts]
rav-evals = "rav_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rav_evals"]

[tool.hatch.build.targets.wheel.force-include]
"src/rav_evals/review/templates" = "rav_evals/review/templates"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs Postgres (docker compose up -d); REQUIRE_DB=1 turns a skip into a failure"]
