name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          packages=$(find packages -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' \
            | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Discovered: $packages"

  test-packages:
    name: pytest ${{ matrix.package }}
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rav
          POSTGRES_PASSWORD: rav
          POSTGRES_DB: rav_ai
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U rav -d rav_ai"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - run: uv run --no-sync pytest
        working-directory: ${{ matrix.package }}

  test-root:
    name: pytest rav-ai (root, Postgres)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rav
          POSTGRES_PASSWORD: rav
          POSTGRES_DB: rav_ai
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U rav -d rav_ai"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - run: uv run --no-sync pytest
