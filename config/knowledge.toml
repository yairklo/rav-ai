# Knowledge layer (rav-kl). Prices are PLACEHOLDERS - verify against the provider price list.

[kl]
mode = "personal"            # personal | public
allow_personal_only = false  # PERSONAL_ONLY_RESTRICTED sources enter only if mode=personal AND this is true
use_steinsaltz_aid = ""      # "" = default (true only in personal mode) | "true" | "false"
steinsaltz_prefix = "Steinsaltz on "   # work-title prefix of the Steinsaltz Bavli commentary
anchor_format = "quote"      # quote | numbered (A/B experiment: numbered adds a word index w)
second_model_fraction = 0.10
batch = false                # use the provider batch API
batch_discount = 0.5         # price multiplier when batch = true (verify)
temperature = 0.0
max_tokens = 8000
window_amudim = 3            # S1 sliding window (pages)
window_overlap = 1
budget_usd = 0.0             # 0 = no cap (the CLI --budget-usd overrides)

# strongest model on every stage by default; second_model is another family
[models]
s0b = "anthropic/claude-haiku-5-5"   # fast model: constrained choice among candidates
s1 = "anthropic/claude-opus-5-5"
s2 = "anthropic/claude-opus-5-5"
s3 = "anthropic/claude-opus-5-5"
s3l = "anthropic/claude-opus-5-5"
s4 = "anthropic/claude-opus-5-5"
s4g = "anthropic/claude-opus-5-5"
s5 = "anthropic/claude-opus-5-5"
second_model = "openai/gpt-5.1"   # placeholder id; other family than the main model

# USD per million tokens (input / output). Placeholders.
[prices."anthropic/claude-opus-5-5"]
input = 4.0
output = 20.0
[prices."anthropic/claude-sonnet-5-5"]
input = 2.0
output = 10.0
[prices."anthropic/claude-haiku-5-5"]
input = 1.0
output = 5.0
[prices."openai/gpt-5.1"]
input = 2.0
output = 10.0

# expected output tokens as a fraction of input tokens, per stage (estimate only)
[out_ratio]
s0b = 0.03
s1 = 0.08
s2 = 0.35

# thresholds for the K checks
[thresholds]
k3_not_found_max_fraction = 0.10
step_max_words = 25
issue_similarity_warn = 0.6
quote_min_words = 2          # a shorter quote (words) is never 'unique'
quote_min_chars = 6          # ... nor one with fewer characters
gate_max_rejected_fraction = 0.1   # promote gate: share of rejected items
gate_min_located_fraction = 0.9
