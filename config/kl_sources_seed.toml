# kl_sources seed: Bavli Shabbat and the commentaries on the sugya (Shabbat 21b-23b), from the
# approved core-books-draft (25.11.2026), sections 1, 2 and 5.
#   tier         - the draft's section: §1 the Gemara = canonical, rishonim (§1/§2) = rishonim,
#                  acharonim on the sugya (§1 Gilyon HaShas, §5) = acharonim
#   role         - primary: the work's own text is a source of claims (lenses / reference-only
#                  works are LENS_RECORDS in rav_knowledge/sources.py)
#   weight_tier  - the draft's grade: יסוד = core, חשוב = major, מורחב = extended
#                  (a tie-breaker for selection / "core books not checked"; never halakhic weight)
#   license_tier - from Sefaria's declaration per version (versions.license -> license_policy
#                  flags). `rav-kl seed-sources` re-checks it against the DB and refuses an entry
#                  that is looser than its most restrictive indexable version (fail-closed).
# Apply: rav-kl seed-sources [--dry-run]. Idempotent. No migration.

[[source]]
title = "Shabbat"
tier = "canonical"
role = "primary"
weight_tier = "core"
license_tier = "NON_COMMERCIAL_ONLY"   # Wikisource CC-BY-SA + William Davidson CC-BY-NC (x2)
draft = "§1 בבלי שבת"

