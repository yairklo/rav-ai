# License policy: computes the three flags stored on every version.
#   can_index           -> may enter search/embedding indexes (private use)
#   can_display_public  -> text may be shown to the public (deployment_mode = public)
#   can_train           -> may be used in model training/fine-tuning data
# Flags are stored on `versions` and ENFORCED at display/export time; ingest never filters.
# Matching: case/space-insensitive; exact key or `aliases`, else the longest key that is a
# prefix at a '-' boundary ("CC-BY-SA 3.0 Unported" -> cc-by-sa). Unlisted or missing => [unknown]
# (fail closed). Edit and run `rav-ingest recompute-flags` to re-apply without re-importing.
# Optional `personal_only = true` on a class: the knowledge layer (rav-kl seed-sources) then
# requires kl_sources.license_tier = PERSONAL_ONLY_RESTRICTED for a work with such a version.
# It is not stored on versions and does not change the three flags. No class uses it yet.

[licenses."public domain"]
aliases = ["pd", "public domain mark", "cc-pdm"]
can_index = true
can_display_public = true
can_train = true

[licenses."cc0"]
can_index = true
can_display_public = true
can_train = true

[licenses."cc-by"]
can_index = true
can_display_public = true
can_train = true

[licenses."cc-by-sa"]
can_index = true
can_display_public = true
can_train = true     # share-alike: legal review before releasing a trained model

[licenses."cc-by-nc-sa"]   # more specific than cc-by-nc; same restrictions
can_index = true
can_display_public = false
can_train = false

[licenses."cc-by-nc"]
can_index = true
can_display_public = false   # non-commercial: private/personal deployment only
can_train = false

[licenses."copyrighted"]
can_index = false
can_display_public = false
can_train = false

[licenses."unknown"]
can_index = false
can_display_public = false
can_train = false
