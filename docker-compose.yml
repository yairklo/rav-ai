services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rav
      POSTGRES_PASSWORD: rav
      POSTGRES_DB: rav_ai
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rav -d rav_ai"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
